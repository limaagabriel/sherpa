name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install yq and jq
        run: |
          sudo curl -fsSL -o /usr/local/bin/yq https://github.com/mikefarah/yq/releases/download/v4.44.5/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
          sudo apt-get update && sudo apt-get install -y jq

      - name: Twin drift
        run: |
          bash scripts/generate-agent-twins.sh
          git diff --exit-code .codex/agents .pi/agents

      - name: Doc hygiene gates
        run: |
          set -e
          # split so this guard's own text doesn't trip a repo-wide grep for the label it forbids
          stale_label="L""4"
          if grep -rEn "\\b${stale_label}\\b" agents/ skills/ protocols/; then
            echo "stale ${stale_label} label found (nothing in the 3-layer model is ${stale_label})" >&2
            exit 1
          fi
          if grep -rEn '\.md:[0-9]+' agents/ skills/ protocols/; then
            echo "brittle line-number citation found (use a § section cite instead)" >&2
            exit 1
          fi
          if grep -rn 'SHAPE_KNOWLEDGE' agents/ hooks/ packs/ protocols/ scripts/ skills/; then
            echo "retired SHAPE_KNOWLEDGE symbol still referenced" >&2
            exit 1
          fi
          # retired /decompose skill: packs/README.md's Step-11 breaking-change note is the one
          # deliberate historical mention (decompose.knowledge -> shape.knowledge); anything else
          # is a regression back to the pre-3-layer-model tree/schema.
          if grep -rn 'skills/decompose' agents/ hooks/ packs/ protocols/ scripts/ skills/ | grep -v '^packs/README\.md:'; then
            echo "retired skills/decompose path still referenced outside packs/README.md's historical note" >&2
            exit 1
          fi
          if grep -rn 'decompose\.knowledge' agents/ hooks/ packs/ protocols/ scripts/ skills/ | grep -v '^packs/README\.md:'; then
            echo "retired decompose.knowledge key still referenced outside packs/README.md's historical note" >&2
            exit 1
          fi
          # layer-label positive asserts: the right label must actually be present, not just the
          # wrong one absent. Agents self-declare via frontmatter 'Layer:'; skills/phase docs via
          # an inline (L<n>) mention (see protocols/layers.md).
          for f in agents/structure-reviewer.md agents/readiness-reviewer.md; do
            if ! grep -q '^Layer: shape$' "$f"; then
              echo "$f missing 'Layer: shape' (L2) self-declaration" >&2
              exit 1
            fi
          done
          for f in agents/step-builder.md agents/acceptance-reviewer.md agents/quality-reviewer.md; do
            if ! grep -q '^Layer: build$' "$f"; then
              echo "$f missing 'Layer: build' (L3) self-declaration" >&2
              exit 1
            fi
          done
          if ! grep -q '(L3)' skills/implement/SKILL.md; then
            echo "skills/implement/SKILL.md missing '(L3)' build-layer self-declaration" >&2
            exit 1
          fi
          if ! grep -q '^# Implement (build layer)$' protocols/workflow/phases/implement.md; then
            echo "protocols/workflow/phases/implement.md missing '(build layer)' self-declaration" >&2
            exit 1
          fi
          total=0
          for f in agents/*.md skills/*/SKILL.md; do
            n=$(sed -n '/^---$/,/^---$/p' "$f" | sed -n '/^description:/,/^[a-z]*:/p' | sed '$d' | sed '1s/^description: *//' | tr -d '"' | wc -w)
            total=$((total + n))
          done
          echo "combined description word total: $total"
          if [ "$total" -gt 460 ]; then
            echo "combined agent/skill description word count ($total) exceeds 460" >&2
            exit 1
          fi

      - name: Version lockstep
        run: |
          root=$(jq -r .version package.json)
          claude=$(jq -r .version .claude-plugin/plugin.json)
          codex=$(jq -r .version .codex-plugin/plugin.json)
          mkt_meta=$(jq -r .metadata.version .claude-plugin/marketplace.json)
          mkt_plugin=$(jq -r .plugins[0].version .claude-plugin/marketplace.json)
          if [ "$root" != "$claude" ] || [ "$root" != "$codex" ] \
            || [ "$root" != "$mkt_meta" ] || [ "$root" != "$mkt_plugin" ]; then
            echo "version skew: package.json=$root .claude-plugin/plugin.json=$claude .codex-plugin/plugin.json=$codex .claude-plugin/marketplace.json(metadata)=$mkt_meta .claude-plugin/marketplace.json(plugins[0])=$mkt_plugin" >&2
            exit 1
          fi

      - name: Resolver test
        run: bash scripts/test-resolve-project-pack.sh
