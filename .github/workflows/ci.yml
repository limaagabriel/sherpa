name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install yq and jq
        run: |
          sudo curl -fsSL -o /usr/local/bin/yq https://github.com/mikefarah/yq/releases/download/v4.44.5/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
          sudo apt-get update && sudo apt-get install -y jq

      - name: Twin drift
        run: |
          bash scripts/agents/build-twins.sh
          git diff --exit-code .codex/agents .pi/agents

      - name: Retired terms
        run: bash scripts/ci/check-terms.sh

      - name: Shared rules inlined
        run: bash scripts/agents/build-rules.sh --check

      - name: Description word budget
        run: |
          set -e
          total=0
          for f in agents/*.md skills/*/SKILL.md; do
            n=$(sed -n '/^---$/,/^---$/p' "$f" | sed -n '/^description:/,/^[a-z]*:/p' | sed '$d' | sed '1s/^description: *//' | tr -d '"' | wc -w)
            total=$((total + n))
          done
          echo "combined description word total: $total"
          if [ "$total" -gt 460 ]; then
            echo "combined agent/skill description word count ($total) exceeds 460" >&2
            exit 1
          fi

      - name: Version lockstep
        run: |
          root=$(jq -r .version package.json)
          claude=$(jq -r .version .claude-plugin/plugin.json)
          codex=$(jq -r .version .codex-plugin/plugin.json)
          mkt_meta=$(jq -r .metadata.version .claude-plugin/marketplace.json)
          mkt_plugin=$(jq -r .plugins[0].version .claude-plugin/marketplace.json)
          if [ "$root" != "$claude" ] || [ "$root" != "$codex" ] \
            || [ "$root" != "$mkt_meta" ] || [ "$root" != "$mkt_plugin" ]; then
            echo "version skew: package.json=$root .claude-plugin/plugin.json=$claude .codex-plugin/plugin.json=$codex .claude-plugin/marketplace.json(metadata)=$mkt_meta .claude-plugin/marketplace.json(plugins[0])=$mkt_plugin" >&2
            exit 1
          fi

      - name: Resolver test
        run: bash scripts/pack/test-load-session.sh

      - name: Resolver env test
        run: bash scripts/pack/test-load-session-env.sh

      - name: Layer loader test
        run: bash scripts/pack/test-load-layer.sh

      - name: Shared pack loader test
        run: bash scripts/pack/test-load-layer-shared.sh

      - name: List skills test
        run: bash scripts/pack/test-list-skills.sh

      - name: Find skill test
        run: bash scripts/pack/test-find-skill.sh

      - name: Session shared test
        run: bash scripts/pack/test-load-session-shared.sh

      - name: Guardrail list test
        run: bash scripts/guardrails/test-list.sh

      - name: Guardrail runner test
        run: bash scripts/guardrails/test-run.sh

      - name: Inline shared rules test
        run: bash scripts/agents/test-build-rules.sh

      - name: Inline shared rules edge-case test
        run: bash scripts/agents/test-build-rules-edge.sh

      - name: Retired terms test
        run: bash scripts/ci/test-check-terms.sh

      - name: Twin generator test
        run: bash scripts/agents/test-build-twins.sh

      - name: Read-only Bash guard test
        run: bash scripts/hooks/test-guard-bash.sh

      - name: Read-only Write guard test
        run: bash scripts/hooks/test-guard-write.sh

      - name: Inventory board test
        run: bash scripts/inventory/test-build-board.sh

      - name: Inventory worktree test
        run: bash scripts/inventory/test-ensure-worktree.sh

      - name: Inventory init test
        run: bash scripts/inventory/test-ensure-board.sh

      - name: Inventory ticket test
        run: bash scripts/inventory/test-ticket.sh

      - name: Inventory run test
        run: bash scripts/inventory/test-run.sh

      - name: CLI test
        run: bash bin/test-sherpa.sh
