# Copy to ${WORKFLOW_PACKS_DIR:-${XDG_CONFIG_HOME:-~/.config}/sherpa/projects}/<project>.yaml (or <repo>/.sherpa/sherpa.yaml) and edit.
# Drop any pack key you don't fill — its engine seam simply no-ops.
# See README.md for what each key does.

name: my-project

# A shell command, run with $CWD exported. Exit 0 = this project is active.
# Detect however you like: cwd glob, file presence (test -f gradlew),
# git remote (git -C "$CWD" remote get-url origin | grep -q my-org), etc.
# Committing this file inside the repo (.claude|.codex|.pi/sherpa.yaml)? Drop
# `detect` entirely — the file's fixed location already proves the project is
# active. Only the shared workspace dir (many projects, one dir) needs a real one.
detect: case "$CWD" in */my-project*) exit 0 ;; *) exit 1 ;; esac

# What the main agent must do at session start when detected (free-form prose).
sessionInstructions: |
  Invoke Skill my-project-init before other work; skip if already invoked this session.

# Extension points the engine consumes, sectioned by skill. `knowledge` values
# are inline prose, forwarded verbatim to every layer and subagent in the
# WORKFLOW_PACK announcement — the prose may itself say "invoke Skill X" if you
# want a skill loaded. architectureRules, codeStyleRules, and validate are
# COMMANDs (the hook auto-quotes values with spaces). Pack values are
# single-line scalars (the WORKFLOW_PACK announcement is one line; newlines
# are collapsed to spaces).
#
# A command may be absolute OR relative to this file's proximate .claude/.codex dir
# (e.g. for a committed .codex/sherpa.yaml: `codeStyleRules: cat ./rules.md`).
# See README.md § Relative paths.
pack:
  knowledge: Invoke Skill my-project-init — loads project rules.   # cross-cutting: every layer, every subagent

  spec:
    knowledge: Additive spec-layer notes for the reviewer.   # optional, additive

  plan:
    knowledge: Additive plan-layer notes for the reviewer.   # optional, additive
    architectureRules: cat /abs/path/to/architecture.md

  implement:
    knowledge: Additive implement-layer notes for the step-builder.   # optional, additive
    codeStyleRules: cat /abs/path/to/rules.md
    validate: |
      npm run lint
      npm test

  diverge:
    knowledge: Additive diverge-layer notes for the diverge-reviewer.   # optional, additive
