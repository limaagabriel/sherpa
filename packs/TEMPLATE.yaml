# Copy to <packs dir>/<project>/project.yaml (or <repo>/.sherpa/sherpa.yaml) and edit.
# <packs dir> is $SHERPA_CONFIG_DIR/projects if set, else $WORKFLOW_PACKS_DIR if set,
# else ${XDG_CONFIG_HOME:-~/.config}/sherpa/projects.
# Drop any pack key you don't fill — its engine seam simply no-ops.
# See README.md for what each key does.

name: my-project

# A shell command, run with $CWD exported. Exit 0 = this project is active.
# Detect however you like: cwd glob, file presence (test -f gradlew),
# git remote (git -C "$CWD" remote get-url origin | grep -q my-org), etc.
# Committing this file inside the repo (.claude|.codex|.pi/sherpa.yaml)? Drop
# `detect` entirely — the file's fixed location already proves the project is
# active. Only the shared workspace dir (many projects, one dir) needs a real one.
detect: case "$CWD" in */my-project*) exit 0 ;; *) exit 1 ;; esac

# What the main agent must do at session start when detected (free-form prose).
sessionInstructions: |
  Invoke Skill my-project-init before other work; skip if already invoked this session.

# Extension points the engine consumes, sectioned by skill. `knowledge` values
# are always literal inline prose — write them at any length; they are never
# inlined eagerly into the WORKFLOW_PACK announcement, each layer skill resolves
# them lazily via `yq` against the announced `configPath` immediately before
# dispatch, then forwards the result unchanged. Subagents cannot Read files or
# invoke a Skill for this input (see agents/*.md) — a knowledge value can never
# point a subagent at something else to load. architectureRules, codeStyleRules,
# and validate are COMMANDs (the hook auto-quotes values with spaces) — these ARE
# inlined directly into the one-line WORKFLOW_PACK announcement, so keep them
# single-line scalars (newlines collapse to spaces); `knowledge` fields have no
# such restriction.
#
# A command may be absolute OR relative. For a committed project-local config it
# resolves against this file's proximate .claude/.codex dir (e.g. a committed
# .codex/sherpa.yaml: `codeStyleRules: cat ./rules.md`). For a workspace pack it
# resolves against this pack's own directory instead (<packs dir>/<project>/), so
# `detect: ./detect.sh` runs the copy that lives next to THIS project.yaml — two
# packs can each keep their own same-named detect.sh without colliding.
# See README.md § Relative paths.
pack:
  knowledge: Prefer named exports over default exports; keep functions under 40 lines.   # cross-cutting: every layer, every subagent

  frame:
    knowledge: Additive frame-layer notes for the reviewer.   # optional, additive

  shape:
    knowledge: Additive shape-layer notes for the shape-reviewer.   # optional, additive

  decompose:
    knowledge: Additive decompose-layer notes for the reviewer.   # optional, additive
    architectureRules: cat /abs/path/to/architecture.md

  implement:
    knowledge: Additive implement-layer notes for the step-builder.   # optional, additive
    codeStyleRules: cat /abs/path/to/rules.md
    validate: |
      npm run lint
      npm test
