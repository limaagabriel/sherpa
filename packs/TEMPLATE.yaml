# Copy to <packs dir>/<project>/project.yaml (or <repo>/.sherpa/sherpa.yaml) and edit.
# <packs dir> is $SHERPA_CONFIG_DIR/projects if set, else $WORKFLOW_PACKS_DIR if set,
# else ${XDG_CONFIG_HOME:-~/.config}/sherpa/projects.
# Drop any pack key you don't fill — its engine seam simply no-ops.
# See README.md for what each key does.

name: my-project

# A shell command, run with $CWD exported. Exit 0 = this project is active.
# Detect however you like: cwd glob, file presence (test -f gradlew),
# git remote (git -C "$CWD" remote get-url origin | grep -q my-org), etc.
# Committing this file inside the repo (.claude|.codex|.pi/sherpa.yaml)? Drop
# `detect` entirely — the file's fixed location already proves the project is
# active. Only the shared workspace dir (many projects, one dir) needs a real one.
detect: case "$CWD" in */my-project*) exit 0 ;; *) exit 1 ;; esac

# What the main agent must do at session start when detected.
# A file path or array of file paths — resolved via scripts/resolve-pack-value.sh.
# Paths are literal (no $HOME or ~ expansion); relative paths resolve against the
# config's base directory. Missing files are warned and skipped per-entry.
context: ./context.txt

# Extension points the engine consumes, sectioned by skill. All content-bearing
# keys (knowledge, architectureRules, codeStyleRules, context) are file paths or
# arrays of file paths — resolved via scripts/resolve-pack-value.sh. Paths are
# literal (no $HOME or ~ expansion); relative paths resolve against the config's
# base directory. Missing files are warned and skipped per-entry.
# Only validate is a shell command, never a path.
#
# For a committed project-local config, relative paths resolve against this file's
# proximate .sherpa/.claude/.codex/.pi directory. For a workspace pack, relative
# paths resolve against this pack's own directory (<packs dir>/<project>/), so two
# packs can each keep their own same-named file (e.g. rules.md) without colliding.
# See README.md § Relative paths and resolution.
pack:
  knowledge: ./knowledge.md   # or: [./knowledge.md, ./extra-knowledge.md]

  frame:
    knowledge: ./frame-knowledge.md   # optional, additive

  shape:
    knowledge: ./shape-knowledge.md   # optional, additive

  decompose:
    knowledge: ./decompose-knowledge.md   # optional, additive
    architectureRules: ./architecture.md

  implement:
    knowledge: ./implement-knowledge.md   # optional, additive
    codeStyleRules: ./rules.md
    validate: npm run lint && npm test   # shell command only; never a path
